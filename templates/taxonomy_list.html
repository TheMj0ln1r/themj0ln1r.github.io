{% extends "base.html" %}

{% block main_content %}
    {% set n = terms | length %}
    {{ post_macros::page_header(title="Tags", subtitle=n ~ " topics") }}
    <ul class="tag-cloud">
        {% for term in terms | sort(attribute="name") %}
        <li>
            <a class="tag" href="{{ term.permalink | safe }}">{{ term.name }}<span class="count">{{ term.pages | length }}</span></a>
        </li>
        {% endfor %}
    </ul>
{% endblock main_content %}
