    { name = "CV", url = "/cv", weight = 2 },
    { name = "Archive", url = "/archive", weight = 3 },
    { name = "Tags", url = "/tags", weight = 4 },
]
socials = [
    { name = "GitHub", url = "https://github.com/TheMj0ln1r/" },
    { name = "X", url = "https://x.com/TheMj0ln1r/" },
    { name = "LinkedIn", url = "https://linkedin.com/in/mj0ln1r/" },
]

